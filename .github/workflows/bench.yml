name: Bench

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Benchmarks
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: '4.0'
        bundler-cache: true

    - name: Generators
      run: RUBYOPT="-W0" bundle exec ruby benchmark/generators.rb
    - name: Require
      run: RUBYOPT="-W0" bundle exec ruby benchmark/require.rb

